<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: hidden;
    }

    /* Scroll container */
    body {
      height: 700vh;
    }

    /* Fixed full-screen canvas viewport */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="animation-canvas"></canvas>
  </div>

  <script>
    (function() {
      const TOTAL_FRAMES = 448;
      const canvas = document.getElementById('animation-canvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      const frames = new Array(TOTAL_FRAMES + 1);
      const loadedMap = new Uint8Array(TOTAL_FRAMES + 1);
      let lastRenderedFrame = -1;

      // Pad frame number to 6 digits (e.g. frame_000001.jpg)
      function getFrameUrl(index) {
        const padded = String(index).padStart(6, '0');
        return `extracted_frames_30fps_jpg/frames/frame_${padded}.jpg`;
      }

      // Handle Retina / High DPI sizing with mobile GPU consideration
      function resizeCanvas() {
        const isMobile = window.innerWidth < 768;
        const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.0 : 1.5);
        const w = window.innerWidth;
        const h = window.innerHeight;

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = isMobile ? 'medium' : 'high';

        // Force re-render current frame on resize
        if (lastRenderedFrame > 0) {
          drawFrame(lastRenderedFrame);
        }
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });
      window.addEventListener('orientationchange', resizeCanvas, { passive: true });
      resizeCanvas();

      // Find the closest loaded frame to avoid any blank frame or flicker
      function getBestAvailableImage(targetIndex) {
        if (loadedMap[targetIndex] && frames[targetIndex]) {
          return frames[targetIndex];
        }

        // Search closest lower and higher frames
        let dist = 1;
        while (dist < TOTAL_FRAMES) {
          const lower = targetIndex - dist;
          if (lower >= 1 && loadedMap[lower] && frames[lower]) {
            return frames[lower];
          }
          const higher = targetIndex + dist;
          if (higher <= TOTAL_FRAMES && loadedMap[higher] && frames[higher]) {
            return frames[higher];
          }
          dist++;
        }
        return null;
      }

      // Render image with cover scaling (centers and fills viewport without distortion)
      function drawFrame(index) {
        const img = getBestAvailableImage(index);
        if (!img) return;

        const cw = canvas.width;
        const ch = canvas.height;
        const iw = img.naturalWidth || 1920;
        const ih = img.naturalHeight || 1080;

        const scale = Math.max(cw / iw, ch / ih);
        const w = iw * scale;
        const h = ih * scale;
        const x = (cw - w) * 0.5;
        const y = (ch - h) * 0.5;

        ctx.drawImage(img, x, y, w, h);
        lastRenderedFrame = index;
      }

      // Preload images with controlled concurrency pool
      const CONCURRENCY = 16;
      let nextIndexToLoad = 1;

      function loadNext() {
        if (nextIndexToLoad > TOTAL_FRAMES) return;
        const index = nextIndexToLoad++;
        const img = new Image();
        img.src = getFrameUrl(index);
        img.onload = () => {
          frames[index] = img;
          loadedMap[index] = 1;
          // Render first frame immediately once it arrives
          if (index === 1 && lastRenderedFrame === -1) {
            drawFrame(1);
          }
          loadNext();
        };
        img.onerror = () => {
          loadNext();
        };
      }

      // Start initial batch of image loading
      for (let i = 0; i < CONCURRENCY; i++) {
        loadNext();
      }

      // Scroll calculation with lerp (linear interpolation) for buttery smoothness
      let targetFrame = 1;
      let currentFrame = 1;

      function updateTargetFromScroll() {
        const scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
        const maxScroll = (document.documentElement.scrollHeight - window.innerHeight) || 1;
        const progress = Math.max(0, Math.min(1, scrollTop / maxScroll));
        targetFrame = 1 + progress * (TOTAL_FRAMES - 1);
      }

      window.addEventListener('scroll', updateTargetFromScroll, { passive: true });
      updateTargetFromScroll();

      // Smooth render loop
      function animationLoop() {
        // Buttery lerp easing
        currentFrame += (targetFrame - currentFrame) * 0.14;

        const frameIndex = Math.min(TOTAL_FRAMES, Math.max(1, Math.round(currentFrame)));
        if (frameIndex !== lastRenderedFrame || lastRenderedFrame === -1) {
          drawFrame(frameIndex);
        }

        requestAnimationFrame(animationLoop);
      }

      requestAnimationFrame(animationLoop);
    })();
  </script>
</body>
</html>
